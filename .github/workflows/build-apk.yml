name: APK oluştur
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Bağımlılıklar
        run: npm install
      - name: Android projesini oluştur
        run: |
          npx cap add android
          npx cap sync android
      - name: Uygulama ikonu
        run: cp -r android-res/. android/app/src/main/res/
      - name: Android izinleri ve sabit imza
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<application android:requestLegacyExternalStorage="true"#' $M
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n</manifest>#' $M
          mkdir -p ~/.android && cp keystore/debug.keystore ~/.android/debug.keystore
      - name: APK derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Ekstrem-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
