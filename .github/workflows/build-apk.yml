name: APK oluştur
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  release:
    types: [ published ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Bağımlılıklar
        run: npm install
      - name: Android projesini oluştur
        run: |
          npx cap add android
          npx cap sync android
      - name: Uygulama ikonu
        run: cp -r android-res/. android/app/src/main/res/
      - name: Sürüm bilgisi
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="$(node -p "require('./package.json').version")"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          G=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${GITHUB_RUN_NUMBER}/" $G
          sed -i "s/versionName \"[^\"]*\"/versionName \"$V\"/" $G
          grep -E "versionCode|versionName" $G
      - name: Android izinleri ve sabit imza
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<application android:requestLegacyExternalStorage="true"#' $M
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n</manifest>#' $M
          # Paylaş → Ekstrem: başka uygulamalardan PDF paylaşımı
          sed -i 's#</application>#    <activity android:name="de.mindlib.sendIntent.SendIntentActivity" android:label="@string/app_name" android:exported="true" android:theme="@style/AppTheme.NoActionBar">\n            <intent-filter>\n                <action android:name="android.intent.action.SEND" />\n                <action android:name="android.intent.action.SEND_MULTIPLE" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <data android:mimeType="application/pdf" />\n            </intent-filter>\n        </activity>\n    </application>#' $M
          grep -n "SendIntentActivity" $M
          # Her derlemede aynı anahtar: Gradle'ın debug imzasını depodaki anahtara bağla.
          # (~/.android'e kopyalamak yetmiyor; runner ANDROID_USER_HOME'u başka yere yönlendiriyor.)
          cat >> android/app/build.gradle <<'GRADLE'

          android.signingConfigs.debug.storeFile = rootProject.file("../keystore/debug.keystore")
          android.signingConfigs.debug.storePassword = "android"
          android.signingConfigs.debug.keyAlias = "androiddebugkey"
          android.signingConfigs.debug.keyPassword = "android"
          GRADLE
      - name: APK derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "../Ekstrem-v${VERSION}.apk"
      - name: İmzayı doğrula
        run: |
          WANT=$(keytool -list -v -keystore keystore/debug.keystore -storepass android | grep -m1 'SHA256:' | awk '{print $2}')
          GOT=$(keytool -printcert -jarfile "Ekstrem-v${VERSION}.apk" | grep -m1 'SHA256:' | awk '{print $2}')
          echo "beklenen: $WANT"; echo "APK:      $GOT"
          test -n "$WANT" && test "$WANT" = "$GOT"
      - uses: actions/upload-artifact@v4
        with:
          name: Ekstrem-apk
          path: Ekstrem-v*.apk
      - name: Sürüm notları
        if: github.event_name == 'release'
        run: |
          awk -v v="## v${VERSION}" 'index($0,v)==1{f=1;next} /^## /{f=0} f' CHANGELOG.md > notlar.md
          printf '\n---\nKurulum: APK dosyasını telefona indirip açın. Yeni sürüm eskisinin üstüne kurulur, veriler korunur.\n' >> notlar.md
          cat notlar.md
      - name: Releases sayfasında yayımla
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          name: Ekstrem v${{ env.VERSION }}
          body_path: notlar.md
          files: Ekstrem-v*.apk
